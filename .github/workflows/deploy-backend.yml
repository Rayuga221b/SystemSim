name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

env:
  REGION: us-central1
  SERVICE: systemsim-api
  REPO: systemsim

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Tests never touch Postgres/Docker/real AI APIs — conftest.py points
      # DATABASE_URL at a throwaway SQLite file, and generation/embeddings
      # are monkeypatched. No secrets needed here.
      - name: Run pytest
        working-directory: backend
        run: python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: backend
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run Alembic migrations
        working-directory: backend
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            "$IMAGE" alembic upgrade head

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          # timeout=600: Groq's retry/backoff (services/groq.py) can block a
          # single /ai/explain or /ai/mentor request for several minutes
          # during a 429 storm — Cloud Run's 300s default can kill that
          # request mid-retry with a 504. 600s gives it room without being
          # unbounded (Cloud Run's own cap is 3600s).
          flags: --allow-unauthenticated --min-instances=0 --timeout=600
          env_vars: |
            ENVIRONMENT=production
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            GROQ_API_KEY=GROQ_API_KEY:latest
